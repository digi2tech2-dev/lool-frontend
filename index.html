    <title>Lool Store | خدماتك الرقمية في مكان واحد</title>
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem('ka-card-theme');
          var safeTheme = theme === 'light' || theme === 'dark' ? theme : 'dark';
          document.documentElement.classList.toggle('dark', safeTheme === 'dark');
          document.documentElement.dataset.theme = safeTheme;
        } catch (error) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 45%, rgb(141 67 239 / 0.24), transparent 52%),
          radial-gradient(circle at 10% 0%, rgb(41 190 235 / 0.16), transparent 35%),
          linear-gradient(180deg, #160c36 0%, #07051a 100%);
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      #app-boot-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader__logo {
        width: clamp(140px, 28vw, 210px);
        height: clamp(90px, 19vw, 132px);
        object-fit: contain;
        animation: boot-logo-motion 1.7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        filter: drop-shadow(0 10px 24px rgb(141 67 239 / 0.42));
      }

      @keyframes boot-logo-motion {
        0% {
          transform: translateY(0) scale(0.985);
        }

        50% {
          transform: translateY(-4px) scale(1);
        }

        100% {
          transform: translateY(0) scale(0.985);
        }
      }

    </style>
  </head>
  <body>
    <div id="app-boot-loader" aria-hidden="true">
      <img class="boot-loader__logo" src="/src/assets/lool-store-logo.webp" alt="Lool Store" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
